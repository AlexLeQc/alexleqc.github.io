<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alexis Guérard</title>
    <meta
      name="description"
      content="Liens professionnels et projets de Alexis Guérard"
    />
    <link rel="icon" type="image/svg+xml" href="assets/icons/cloud.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="fixed-bg"></div>
    <main class="container">
      <div class="view-buttons">
        <div class="main-buttons">
          <button class="btn view-btn active" data-view="home" data-i18n="nav.home">Accueil</button>
          <button class="btn view-btn" data-view="projects" data-i18n="nav.projects">Projets</button>
        </div>
        <button class="btn lang-btn" id="lang-toggle" data-lang="en" title="Switch to English">EN</button>
      </div>
      <div id="home-view" class="view active">
        <header class="profile-header">
          <img
            src="assets/images/photo.jpg"
            alt="Profil picture of Alex Leqc"
            class="profile-image"
          />
          <h1 data-i18n="profile.title">Alexis Guérard</h1>
          <button
            type="button"
            class="btn lien-contact"
            id="button-copy-email"
            onclick="copyToClipboard(this)"
          >
            alexis.guerard@usherbrooke.ca
          </button>
          <p class="bio" data-i18n="profile.bio">
            Étudiant en génie informatique à l'<a
              href="https://www.usherbrooke.ca/genie"
              target="_blank"
              rel="noopener noreferrer"
              >Université de Sherbrooke</a
            >
          </p>
        </header>

        <nav class="link-list">
          <div class="social-row">
            <a
              href="https://github.com/AlexLeQc"
              class="btn lien-principal-github"
            >
              <img src="assets/icons/github.svg" alt="" class="btn-icon" />
              <span data-i18n="social.github">GitHub</span>
            </a>
            <a
              href="https://www.linkedin.com/in/alexis-gu%C3%A9rard-089224212/"
              class="btn lien-linkedin"
            >
              <img src="assets/icons/linkedin.svg" alt="" class="btn-icon" />
              <span data-i18n="social.linkedin">LinkedIn</span>
            </a>
          </div>
          <a href="assets/CV_AlexisGuerard_2026.pdf" class="btn lien-cv" download data-i18n="profile.cv"
            >Télécharger mon CV</a
          >
        </nav>
      </div>
      <div id="projects-view" class="view">
        <header class="profile-header">
          <img
            src="assets/images/photo.jpg"
            alt="Alexis Guérard"
            class="profile-image"
          />
          <h1 data-i18n="projects.title">Mes Projets</h1>
          <p class="bio" data-i18n="projects.description">
            Réalisations en génie informatique et projets personnels
          </p>
        </header>
  
        <nav class="link-list">
          <a
            href="https://github.com/AtlasPMC68/Atlas"
            class="btn lien-secondaire"
            target="_blank"
            data-i18n="projects.atlas"
          >
            Atlas (Projet majeur de conception)
          </a>

          <a
            href="https://keepthetrackk.web.app/"
            class="btn lien-secondaire"
            target="_blank"
            data-i18n="projects.keepTheTrackk"
          >
            KeepTheTrackk
          </a>

          <a
            href="https://alexleqc.github.io/mini_g_web/"
            class="btn lien-secondaire"
            target="_blank"
            data-i18n="projects.miniGolf"
          >
            Mini Golf
          </a>
        </nav>
      </div>
      <footer>
        <p data-i18n="footer.copyright">&copy; 2025 Alexis Guérard.</p>
      </footer>
    </main>


    <script src="js/clipboard.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/navigation.js"></script>
    <div id="copy-toast" class="toast-popup" data-i18n="toast.emailCopied">Email copié !</div>
  </body>
</html>
